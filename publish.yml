name: Build and publish ComfyUI Docker image

on:
  push:
    branches: [main, pulid-test, reactor-cache]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/.ghcup
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tag
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          case "$GITHUB_REF_NAME" in
            main) TAG=latest ;;
            pulid-test) TAG=pulid-test ;;
            reactor-cache) TAG=reactor-cache ;;
            *) echo "Unsupported branch" >&2; exit 1 ;;
          esac
          echo "IMAGE=ghcr.io/${OWNER}/comfyui-global:${TAG}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
